<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pyr1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pyr2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pyr3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pyr4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="440" rx="12" fill="url(#bgCog)"/>

  <!-- Title -->
  <text x="450" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    CLOUD-OPTIMIZED GEOTIFF (COG): INTERNAL PYRAMID STRUCTURE
  </text>
  <text x="450" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    How Overview Pyramids &amp; 256×256 Tile Blocks Enable Instant Dynamic HTTP Range Queries
  </text>

  <!-- Left: Standard TIFF vs COG comparison -->
  <g transform="translate(40, 90)">
    <!-- Standard TIFF Box -->
    <rect width="240" height="310" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#991b1b"/>
    <text x="120" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ STANDARD GEOTIFF</text>
    
    <g transform="translate(20, 50)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <rect x="0" y="0" width="200" height="15" fill="#334155" stroke="#64748b"/>
      <rect x="0" y="18" width="200" height="15" fill="#334155" stroke="#64748b"/>
      <rect x="0" y="36" width="200" height="15" fill="#334155" stroke="#64748b"/>
      <rect x="0" y="54" width="200" height="15" fill="#334155" stroke="#64748b"/>
      <text x="100" y="45" font-family="sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Scanline Strips (Full Width)</text>

      <text x="0" y="100" font-weight="bold" fill="#ef4444">Problems:</text>
      <text x="0" y="125">• Must read entire file into RAM</text>
      <text x="0" y="145">• No built-in downscaled overviews</text>
      <text x="0" y="165">• Zooming out spikes CPU &amp; memory</text>
      <text x="0" y="185">• Impossible to stream on the web</text>
      <text x="0" y="215" fill="#f87171" font-weight="bold">Result: 2.5s+ latency per tile</text>
    </g>
  </g>

  <!-- Right: COG Structure -->
  <g transform="translate(310, 90)">
    <rect width="550" height="310" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="550" height="32" rx="8" fill="#065f46"/>
    <text x="275" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ CLOUD-OPTIMIZED GEOTIFF (COG)</text>

    <!-- Header Block -->
    <g transform="translate(20, 48)">
      <rect width="510" height="34" rx="4" fill="#0f172a" stroke="#3b82f6"/>
      <text x="255" y="22" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">TIFF Header &amp; Tile Byte Offsets (Front-Loaded)</text>
    </g>

    <!-- Pyramid Visualization -->
    <!-- Overview 16 -->
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="80" height="35" rx="4" fill="url(#pyr4)"/>
      <text x="40" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">OVR 16 (1/16)</text>
      <text x="95" y="22" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">Zoom 0–6: Global continent overview (~4 KB)</text>
    </g>

    <!-- Overview 8 -->
    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="130" height="35" rx="4" fill="url(#pyr3)"/>
      <text x="65" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">OVR 8 (1/8)</text>
      <text x="145" y="22" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">Zoom 7–9: Regional state view (~12 KB)</text>
    </g>

    <!-- Overview 4 & 2 -->
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="200" height="35" rx="4" fill="url(#pyr2)"/>
      <text x="100" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">OVR 2 &amp; 4 (1/2, 1/4)</text>
      <text x="215" y="22" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">Zoom 10–12: Sector / Valley view (~25 KB)</text>
    </g>

    <!-- Full Resolution Level 0 -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="300" height="35" rx="4" fill="url(#pyr1)"/>
      <text x="150" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">LEVEL 0: RAW FULL RESOLUTION (256×256 TILES)</text>
      <text x="315" y="22" font-family="sans-serif" font-size="10.5" fill="#a7f3d0" font-weight="bold">Zoom 13–18: Street/Meter Level</text>
    </g>

    <!-- Bottom Benefit -->
    <text x="275" y="295" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#34d399" text-anchor="middle">
      ⚡ Client only requests the specific 15 KB tile block at the current zoom level!
    </text>
  </g>
</svg>
