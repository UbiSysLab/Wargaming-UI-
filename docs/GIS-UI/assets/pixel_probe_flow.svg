<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="380" rx="12" fill="url(#bg3)"/>

  <text x="450" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">
    IDENTIFY TOOL: PIXEL PROBE QUERY WORKFLOW
  </text>
  <text x="450" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    What happens in milliseconds when an officer clicks any pixel on the tactical map
  </text>

  <!-- Step 1 -->
  <g transform="translate(40, 90)">
    <rect width="180" height="240" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="180" height="32" rx="8" fill="url(#step1)"/>
    <text x="90" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. MAP CLICK</text>
    <g transform="translate(15, 55)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <text x="0" y="0" font-weight="bold" fill="#38bdf8">Leaflet Event</text>
      <text x="0" y="20">User clicks on map</text>
      <text x="0" y="45" font-family="monospace" font-size="10" fill="#facc15">Lat: 34.80079°N</text>
      <text x="0" y="65" font-family="monospace" font-size="10" fill="#facc15">Lon: 76.52013°E</text>
      <text x="0" y="100">Dispatches HTTP:</text>
      <text x="0" y="120" font-family="monospace" font-size="9" fill="#93c5fd">GET /api/inspect?</text>
      <text x="0" y="135" font-family="monospace" font-size="9" fill="#93c5fd">lon=76.52&amp;lat=34.80</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 230 200 L 255 200" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="255,195 265,200 255,205" fill="#38bdf8"/>

  <!-- Step 2 -->
  <g transform="translate(270, 90)">
    <rect width="180" height="240" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="180" height="32" rx="8" fill="url(#step2)"/>
    <text x="90" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. FASTAPI POINT READ</text>
    <g transform="translate(15, 55)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <text x="0" y="0" font-weight="bold" fill="#34d399">Rio-Tiler Engine</text>
      <text x="0" y="20">Opens COG header</text>
      <text x="0" y="40">Executes:</text>
      <text x="0" y="60" font-family="monospace" font-size="10" fill="#a7f3d0">src.point(lon, lat)</text>
      <text x="0" y="90">Reads single int8 pixel</text>
      <text x="0" y="110">from raster matrix:</text>
      <text x="0" y="135" font-weight="bold" font-size="13" fill="#10b981">Raw Value = 5</text>
      <text x="0" y="155" font-size="9.5" fill="#94a3b8">Execution time: &lt;4ms</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 460 200 L 485 200" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="485,195 495,200 485,205" fill="#38bdf8"/>

  <!-- Step 3 -->
  <g transform="translate(500, 90)">
    <rect width="180" height="240" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="180" height="32" rx="8" fill="url(#step3)"/>
    <text x="90" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. TACTICAL METADATA</text>
    <g transform="translate(15, 55)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <text x="0" y="0" font-weight="bold" fill="#fbbf24">Value Attribute Map</text>
      <text x="0" y="20">Maps 5 ➔</text>
      <text x="0" y="40" font-weight="bold" fill="#10b981">"Very High (Optimal)"</text>
      <text x="0" y="65">Attaches Engineering</text>
      <text x="0" y="80">Tactical Profile:</text>
      <text x="0" y="105" font-size="9.5" fill="#fde68a">"Solid bedrock, flat</text>
      <text x="0" y="120" font-size="9.5" fill="#fde68a">approach road, low</text>
      <text x="0" y="135" font-size="9.5" fill="#fde68a">water scouring."</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 690 200 L 715 200" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="715,195 725,200 715,205" fill="#38bdf8"/>

  <!-- Step 4 -->
  <g transform="translate(730, 90)">
    <rect width="140" height="240" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="140" height="32" rx="8" fill="url(#step4)"/>
    <text x="70" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4. UI RENDER</text>
    <g transform="translate(10, 55)" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">
      <text x="0" y="0" font-weight="bold" fill="#c4b5fd">Interactive Pin</text>
      <text x="0" y="20">Drops Green Pin</text>
      <text x="0" y="40">on exact pixel</text>
      <text x="0" y="70" font-weight="bold" fill="#a78bfa">Probe Tab</text>
      <text x="0" y="90">Switches tab to</text>
      <text x="0" y="110">show full military</text>
      <text x="0" y="130">suitability report</text>
      <text x="0" y="150" font-weight="bold" fill="#10b981">Instant Adjudication</text>
    </g>
  </g>
</svg>
